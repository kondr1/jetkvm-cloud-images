name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read upstream pins
        run: cat upstream.env | grep -v '^#' >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.CLOUD_API_REPO }}
          ref: ${{ env.CLOUD_API_REF }}
          path: upstream/cloud-api

      - name: Apply patches
        run: |
          for p in api/patches/*.patch; do
            echo "::group::$p"
            git -C upstream/cloud-api apply --verbose "$PWD/$p"
            echo "::endgroup::"
          done

      - uses: docker/setup-buildx-action@v3

      - name: Build Bun image
        uses: docker/build-push-action@v6
        with:
          context: upstream/cloud-api
          file: api/Dockerfile
          load: true
          tags: jetkvm-cloud-api:test
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Upstream's own node + ts-node image with the same patches: the baseline for the memory comparison.
      - name: Build node baseline image
        uses: docker/build-push-action@v6
        with:
          context: upstream/cloud-api
          load: true
          tags: jetkvm-cloud-api:node
          cache-from: type=gha,scope=api-node
          cache-to: type=gha,scope=api-node,mode=max

      - name: e2e
        run: |
          {
            echo "### cloud-api memory"
            echo "| runtime | image | idle | after tests |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          tests/e2e/run.sh bun jetkvm-cloud-api:test "bun --bun x prisma migrate deploy"
          tests/e2e/run.sh node jetkvm-cloud-api:node "npx prisma migrate deploy"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: e2e-*.log

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=$REGISTRY/jetkvm-cloud-api
          for tag in latest "sha-${GITHUB_SHA::7}" "upstream-${CLOUD_API_REF::7}"; do
            docker tag jetkvm-cloud-api:test "$image:$tag"
            docker push "$image:$tag"
          done

  upstream-tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: jetkvm
          POSTGRES_PASSWORD: jetkvm
          POSTGRES_DB: jetkvm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jetkvm -d jetkvm"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - name: Read upstream pins
        run: cat upstream.env | grep -v '^#' >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.CLOUD_API_REPO }}
          ref: ${{ env.CLOUD_API_REF }}
          path: upstream/cloud-api

      - name: Apply patches
        run: for p in api/patches/*.patch; do git -C upstream/cloud-api apply "$PWD/$p"; done

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Upstream test suite on the patched sources
        working-directory: upstream/cloud-api
        env:
          DATABASE_URL: postgresql://jetkvm:jetkvm@localhost:5432/jetkvm?schema=public
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx tsc --noEmit
          npx vitest run

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read upstream pins
        run: cat upstream.env | grep -v '^#' >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.KVM_REPO }}
          ref: ${{ env.KVM_REF }}
          path: upstream/kvm
          # ui/ has symlinks into internal/ (e.g. public/sse.html)
          sparse-checkout: |
            ui
            internal

      - name: Resolve symlinks that point outside ui/
        run: |
          find upstream/kvm/ui -path '*/node_modules' -prune -o -type l -print | while read -r link; do
            target=$(readlink -f "$link")
            case "$target" in "$PWD/upstream/kvm/ui/"*) continue ;; esac
            echo "$link -> $target"
            cp --remove-destination "$target" "$link"
          done

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ui
          build-contexts: kvm-ui=upstream/kvm/ui
          load: true
          tags: jetkvm-cloud-ui:test
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

      - name: Smoke test
        run: tests/ui-smoke.sh jetkvm-cloud-ui:test

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=$REGISTRY/jetkvm-cloud-ui
          for tag in latest "sha-${GITHUB_SHA::7}" "upstream-${KVM_REF::7}"; do
            docker tag jetkvm-cloud-ui:test "$image:$tag"
            docker push "$image:$tag"
          done
